[package]
name = "kolyan-server-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "kolyan-server"
path = "src/main.rs"

[[bin]]
name = "kolyan-server-tool-worker"
path = "../../crates/kolyan-tool-worker/src/main.rs"

[dependencies]
kolyan-server = { path = "../../crates/kolyan-server" }
kolyan-ledger = { path = "../../crates/kolyan-ledger" }
kolyan-core = { path = "../../crates/kolyan-core" }
kolyan-model = { path = "../../crates/kolyan-model" }
kolyan-policy = { path = "../../crates/kolyan-policy" }
kolyan-tools = { path = "../../crates/kolyan-tools" }
kolyan-tool-worker = { path = "../../crates/kolyan-tool-worker" }
kolyan-storage = { path = "../../crates/kolyan-storage" }
kolyan-trace = { path = "../../crates/kolyan-trace" }
kolyan-protocol-openai = { path = "../../crates/kolyan-protocol-openai" }
kolyan-protocol-http = { path = "../../crates/kolyan-protocol-http" }
kolyan-protocol-anthropic = { path = "../../crates/kolyan-protocol-anthropic" }
kolyan-provider-openai = { path = "../../crates/kolyan-provider-openai" }
kolyan-provider-anthropic = { path = "../../crates/kolyan-provider-anthropic" }
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "net", "signal"] }

[dev-dependencies]
sha2 = "0.10"
reqwest.workspace = true
kolyan-runtime = { path = "../../crates/kolyan-runtime" }
tempfile = "3"
toml = "0.8"
futures-util.workspace = true

[[test]]
name = "server_process"
path = "../../crates/kolyan-integration-tests/tests/server/process.rs"

[[test]]
name = "server_http_process"
path = "../../crates/kolyan-integration-tests/tests/server/http_process.rs"

[[test]]
name = "server_http_environment_tools"
path = "../../crates/kolyan-integration-tests/tests/server/http_environment_tools.rs"
