[package]
name = "kolyan-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kolyan-core = { path = "../kolyan-core" }
kolyan-ledger = { path = "../kolyan-ledger" }
kolyan-model = { path = "../kolyan-model" }
kolyan-policy = { path = "../kolyan-policy" }
kolyan-runtime = { path = "../kolyan-runtime" }
kolyan-sandbox = { path = "../kolyan-sandbox" }
kolyan-server = { path = "../kolyan-server" }
kolyan-storage = { path = "../kolyan-storage" }
kolyan-tools = { path = "../kolyan-tools" }
kolyan-trace = { path = "../kolyan-trace" }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1.20"
thiserror.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
tempfile = "3"
futures-util.workspace = true
tokio = { version = "1", features = ["macros", "rt", "time"] }
