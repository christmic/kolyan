path = "tests/provider/sdk_transport.rs"

[dev-dependencies]
tempfile = "3"
nix = { version = "0.30", features = ["fs", "signal", "process"] }

[[test]]
name = "request_planning"
path = "tests/provider/request_planning.rs"

[[test]]
name = "prepared_generation"
path = "tests/provider/prepared_generation.rs"

[[test]]
name = "ledger_scoped_recovery"
path = "tests/ledger/scoped_recovery.rs"

[dependencies]
# Workspace tokio only enables the "time" feature, but #[tokio::test] and the
# multi-thread runtime require "macros", "rt", and "rt-multi-thread". Declare a
# local dep with the full feature set instead of widening the workspace dep,
# because no other crate needs it.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "process"] }

# Workspace helpers.
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

# Sibling Kolyan crates. The provider adapter crates are the unit under test;
# the model crate is the neutral contract; the protocol crates carry the
# OpenAiConfig / AnthropicConfig structs that wire base_url + auth header.
kolyan-core = { path = "../kolyan-core" }
kolyan-agent = { path = "../kolyan-agent" }
kolyan-types = { path = "../kolyan-types" }
kolyan-storage = { path = "../kolyan-storage" }
kolyan-model = { path = "../kolyan-model" }
kolyan-provider-openai = { path = "../kolyan-provider-openai" }
kolyan-provider-anthropic = { path = "../kolyan-provider-anthropic" }
kolyan-policy = { path = "../kolyan-policy" }
kolyan-tools = { path = "../kolyan-tools" }
kolyan-sandbox = { path = "../kolyan-sandbox" }
kolyan-tool-worker = { path = "../kolyan-tool-worker" }
kolyan-ledger = { path = "../kolyan-ledger" }
kolyan-runtime = { path = "../kolyan-runtime" }
kolyan-server = { path = "../kolyan-server" }
kolyan-trace = { path = "../kolyan-trace" }
kolyan-protocol-openai = { path = "../kolyan-protocol-openai" }
kolyan-protocol-http = { path = "../kolyan-protocol-http" }
kolyan-protocol-anthropic = { path = "../kolyan-protocol-anthropic" }

# Workspace does not declare a TOML parser. The live-tests.toml file is read
# once at test time via include_str! + toml::from_str.
toml = "0.8"
