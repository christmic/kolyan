[package]
name = "kolyan-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Real-network live regression tests for Kolyan provider adapters (MiniMax China-region OpenAI-compatible and Anthropic-compatible endpoints)."

# Cargo builds this exact production entrypoint for process integration tests;
# no duplicate worker implementation or external build step is required.
[[bin]]
name = "kolyan-test-tool-worker"
path = "../kolyan-tool-worker/src/main.rs"
test = false

[[test]]
name = "provider_openai_compat"
path = "tests/provider/openai_compat.rs"

[[test]]
name = "provider_anthropic_compat"
path = "tests/provider/anthropic_compat.rs"

[[test]]
name = "provider_openai_opening"
path = "tests/provider/openai_opening.rs"

[[test]]
name = "provider_anthropic_opening"
path = "tests/provider/anthropic_opening.rs"

[[test]]
name = "core_step"
path = "tests/core/step.rs"

[[test]]
name = "core_turn"
path = "tests/core/turn.rs"

[[test]]
name = "turn_contract"
path = "tests/core/turn_contract.rs"

[[test]]
name = "policy_authorization"
path = "tests/core/policy_authorization.rs"

[[test]]
name = "durable_approval"
path = "tests/core/durable_approval.rs"

[[test]]
name = "agent_root"
path = "tests/agent/root.rs"

[[test]]
name = "agent_long_task"
path = "tests/agent/long_task.rs"

[[test]]
name = "turn_resume"
path = "tests/core/turn_resume.rs"

[[test]]
name = "runtime_boundary"
path = "tests/runtime/boundary.rs"

[[test]]
name = "server_coordinator"
path = "tests/server/coordinator.rs"

[[test]]
name = "server_runtime_approval"
path = "tests/server/runtime_approval.rs"

[[test]]
name = "server_runtime_approval_live"
path = "tests/server/runtime_approval_live.rs"

[[test]]
name = "session"
path = "tests/session.rs"

[[test]]
name = "session_execution"
path = "tests/session_execution.rs"

[[test]]
name = "session_execution_live"
path = "tests/session_execution_live.rs"

[lints]
workspace = true

[[test]]
name = "fact_journal"
path = "tests/ledger/fact_journal.rs"

[[test]]
name = "file_worker_process"
path = "tests/tools/file_worker_process.rs"

[[test]]
